plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.strava.kudos'
    compileSdk 34

    defaultConfig {
        applicationId "com.strava.kudos"
        minSdk 24
        targetSdk 34
        versionCode 199
        versionName "1.9.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abiName = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            outputFileName = "strakudos-v${variant.versionName}-${abiName}.apk"
        }
    }

    signingConfigs {
        release {
            def localKeystore = rootProject.file('.secrets/strakudos-release.jks')
            if (localKeystore.exists()) {
                storeFile localKeystore
                storePassword 'strakudos-release-pass'
                keyAlias 'strakudos'
                keyPassword 'strakudos-release-pass'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs = []
            kotlin.srcDirs = ['src/main/kotlin']
        }
        test {
            java.srcDirs = []
            kotlin.srcDirs = ['src/test/kotlin']
        }
        androidTest {
            java.srcDirs = []
            kotlin.srcDirs = ['src/androidTest/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
